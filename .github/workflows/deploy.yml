name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
      - name: Install dependencies
        run: npm ci
      - name: Cache Quartz plugins
        id: quartz-cache
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz.lock.json', 'package-lock.json', '.nvmrc') }}
      - name: Install Quartz plugins
        if: steps.quartz-cache.outputs.cache-hit != 'true'
        run: npm run plugins:install
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set production URL
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/pages-config.mjs
      - name: Build
        run: npm run build
      - name: Check site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run check:knowledge
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
